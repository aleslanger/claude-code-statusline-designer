[project]
name = "claude-code-statusline-designer"
version = "0.1.0"
description = "Design, preview and install a themed statusline for Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleš Langer" }]
keywords = ["claude-code", "statusline", "powerline", "terminal", "theme", "curses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/aleslanger/claude-code-statusline-designer"
Issues = "https://github.com/aleslanger/claude-code-statusline-designer/issues"
Changelog = "https://github.com/aleslanger/claude-code-statusline-designer/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff", "pyte>=0.8", "build>=1", "twine>=5"]

[project.scripts]
claude-style = "claude_style.cli:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_style"]
