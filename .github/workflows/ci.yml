name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  LANG: C.UTF-8  # the curses menu and its tests draw Unicode
  LC_ALL: C.UTF-8

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.13"]
        include:
          # macOS runs the generated statusline under its bash 3.2
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check claude_style tests scripts
      - name: Test
        run: python -m pytest --cov=claude_style --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
